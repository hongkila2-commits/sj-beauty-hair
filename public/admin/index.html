<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SJ뷰티헤어 · 글 관리</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      설정 파일 위치를 절대경로로 못박는다.
      이 줄이 없으면 Decap CMS 는 'config.yml' 을 문서 기준 상대경로로 찾는데,
      주소가 /admin (끝 슬래시 없음) 이면 /config.yml 로 해석돼 404 가 난다.
    -->
    <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />

    <!--
      설정을 직접 넘기기 위해 자동 시작을 끈다.
      반드시 CMS 스크립트보다 먼저 선언해야 한다.
    -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
  </head>
  <body>
    <!--
      버전을 정확히 고정한다. ^3.8.4 같은 범위로 두면 CMS 가 새로 배포될 때마다
      이 화면이 말없이 따라 올라가고, 어느 날 갑자기 깨질 수 있다.
      올릴 때는 이 숫자를 직접 바꾸고 /admin 에서 동작을 확인한다.
    -->
    <script src="https://unpkg.com/decap-cms@3.16.2/dist/decap-cms.js"></script>

    <script>
      /*
        로그인 주소를 '지금 접속한 주소'로 맞춘다.

        config.yml 의 base_url 에는 빌드 때 대표 도메인(sjbthair.com)이 박힌다.
        그대로 두면 sj-beauty-hair.vercel.app 으로 들어와도 로그인은
        sjbthair.com 을 거치게 되어, 대표 도메인 한 곳이 막히면
        두 주소 모두 로그인이 죽는다. 실제로 그런 일이 있었다.

        아래 한 줄로 두 주소가 서로 독립적으로 동작한다.
          sjbthair.com/admin              → sjbthair.com/api/auth
          sj-beauty-hair.vercel.app/admin → sj-beauty-hair.vercel.app/api/auth

        config.yml 은 여전히 읽힌다. 여기서 넘긴 항목만 덮어쓰고 나머지는 그대로다.
      */
      (function () {
        if (!window.CMS || typeof window.CMS.init !== 'function') {
          document.body.innerHTML =
            '<div style="font-family:system-ui;padding:48px;text-align:center;color:#3f4a52">' +
            '<h1 style="font-size:1.125rem">관리자 화면을 불러오지 못했습니다</h1>' +
            '<p style="color:#b3261e;font-weight:600">편집기 파일(decap-cms.js)을 내려받지 못했습니다.</p>' +
            '<p style="color:#7a858d;font-size:0.875rem">네트워크 연결을 확인하고 새로고침해 주세요.</p>' +
            '</div>';
          return;
        }

        window.CMS.init({
          config: {
            backend: { base_url: window.location.origin },
          },
        });
      })();
    </script>
  </body>
</html>
