<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SJ뷰티헤어 · 글 관리</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      설정 파일 위치를 절대경로로 못박는다.
      이 줄이 없으면 Decap CMS 는 'config.yml' 을 문서 기준 상대경로로 찾는데,
      주소가 /admin (끝 슬래시 없음) 이면 /config.yml 로 해석돼 404 가 난다.
    -->
    <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />

    <!--
      자동 시작을 끈다. 편집기를 못 받았을 때 빈 화면 대신 이유를 보여주기 위해서다.
      반드시 CMS 스크립트보다 먼저 선언해야 한다.
    -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
  </head>
  <body>
    <!--
      버전을 정확히 고정한다. ^3.8.4 같은 범위로 두면 CMS 가 새로 배포될 때마다
      이 화면이 말없이 따라 올라가고, 어느 날 갑자기 깨질 수 있다.
      올릴 때는 이 숫자를 직접 바꾸고 /admin 에서 동작을 확인한다.
    -->
    <script src="https://unpkg.com/decap-cms@3.16.2/dist/decap-cms.js"></script>

    <script>
      /*
        로그인 주소(base_url)는 여기서 건드리지 않는다. config.yml 에 적힌
        대표 도메인을 그대로 쓴다. location.origin 으로 바꾸면 안 된다.

        이유: GitHub OAuth App 은 돌아올 주소(Callback URL)를 **딱 하나만** 가진다.
        로그인은 이렇게 흐른다.

          /api/auth (A도메인)  → 확인용 쿠키를 A도메인에 심는다
          → GitHub            → 등록된 Callback URL(B도메인)로 돌려보낸다
          → /api/callback (B도메인) → A에 심은 쿠키가 여기엔 없다 → 실패

        즉 A와 B가 다르면 로그인이 안 된다. 그래서 어느 주소로 들어오든
        로그인만은 등록된 대표 도메인 한 곳을 거치게 해야 한다.
        그러면 sj-beauty-hair.vercel.app 에서 들어와도 로그인이 된다
        (토큰은 창을 넘어 전달되므로 도메인이 달라도 괜찮다).
      */
      (function () {
        if (!window.CMS || typeof window.CMS.init !== 'function') {
          document.body.innerHTML =
            '<div style="font-family:system-ui;padding:48px;text-align:center;color:#3f4a52">' +
            '<h1 style="font-size:1.125rem">관리자 화면을 불러오지 못했습니다</h1>' +
            '<p style="color:#b3261e;font-weight:600">편집기 파일(decap-cms.js)을 내려받지 못했습니다.</p>' +
            '<p style="color:#7a858d;font-size:0.875rem">네트워크 연결을 확인하고 새로고침해 주세요.</p>' +
            '</div>';
          return;
        }

        // 설정은 전부 config.yml 에서 온다. 여기서 덮어쓰지 않는다.
        window.CMS.init();
      })();
    </script>
  </body>
</html>
