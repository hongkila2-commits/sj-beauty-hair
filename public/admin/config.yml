# ─────────────────────────────────────────────────────────────
# 글 관리 화면 설정
#
# 여기 적힌 항목이 /admin 화면의 입력칸이 된다.
# 주의: 여기에 적지 않은 항목은 저장할 때 파일에서 사라진다.
#       그래서 지점 주소·사진·자치구 같은 구조 정보는 src/config.ts 에 둔다.
# ─────────────────────────────────────────────────────────────

# __SITE_URL__ 은 빌드할 때 src/site.mjs 의 주소로 자동 치환된다.
# 도메인을 바꿀 때 이 파일은 손대지 않는다.
backend:
  name: github
  repo: hongkila2-commits/sj-beauty-hair
  branch: main
  base_url: __SITE_URL__
  auth_endpoint: api/auth

media_folder: public/uploads
public_folder: /uploads

locale: ko

site_url: __SITE_URL__
display_url: __SITE_URL__
logo_url: __SITE_URL__/logo.png

collections:
  # ── 헤어칼럼 ────────────────────────────────────────────────
  - name: posts
    label: 헤어칼럼
    label_singular: 글
    description: 홈페이지 '헤어칼럼' 에 올라가는 글입니다.
    folder: content/posts
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: 'blog/{{slug}}'
    sortable_fields: [date, title]
    view_filters:
      - label: 작성 중인 글만
        field: draft
        pattern: true
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: date, label: 작성일, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - name: category
        label: 분류
        widget: select
        options: ['헤어칼럼', '스타일', '공지']
        default: 헤어칼럼
      - name: summary
        label: 한 줄 요약
        widget: text
        required: false
        hint: 목록 화면과 검색 결과에 표시됩니다. 두 줄을 넘기지 않는 편이 좋습니다.
      - name: thumbnail
        label: 대표 사진
        widget: image
        required: false
        hint: 목록에서 보이는 사진입니다. 가로로 긴 사진이 잘 어울립니다.
      - { name: author, label: 작성자, widget: string, default: 'SJ뷰티헤어' }
      - name: draft
        label: 작성 중 (체크하면 홈페이지에 보이지 않습니다)
        widget: boolean
        default: false
      - { name: body, label: 본문, widget: markdown }

  # ── 영상 ────────────────────────────────────────────────────
  - name: videos
    label: 영상
    label_singular: 영상
    description: 홈페이지 '영상' 페이지에 올라가는 유튜브 영상입니다.
    folder: content/videos
    create: true
    slug: '{{slug}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: 영상 제목, widget: string }
      - name: youtubeId
        label: 유튜브 코드
        widget: string
        hint: "유튜브 주소 끝의 11자리입니다. 예) https://youtu.be/AbCdEfGhIjK → AbCdEfGhIjK"
        pattern: ['^[A-Za-z0-9_-]{11}$', '유튜브 코드 11자리를 정확히 입력해 주세요.']
      - name: thumbnail
        label: 대표 이미지
        widget: image
        required: false
        hint: 목록에 보일 사진입니다. 올리지 않으면 유튜브가 만든 썸네일이 대신 쓰입니다. 누르면 유튜브로 이동합니다.
      - { name: date, label: 등록일, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - { name: description, label: 설명, widget: text, required: false }
      - name: draft
        label: 작성 중 (체크하면 홈페이지에 보이지 않습니다)
        widget: boolean
        default: false
      - { name: body, label: 메모, widget: markdown, required: false }

  # ── 이벤트 ──────────────────────────────────────────────────
  - name: promotions
    label: 이벤트·프로모션
    label_singular: 이벤트
    description: 할인·혜택 안내입니다. 카드뉴스 형태로 보여집니다.
    folder: content/promotions
    create: true
    slug: '{{slug}}'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: 이벤트 이름, widget: string }
      - { name: subtitle, label: 한 줄 설명, widget: string, required: false }
      - name: badge
        label: 딱지 문구
        widget: string
        required: false
        hint: "카드 위에 붙는 작은 표시입니다. 예) 상시, 10월 한정"
      - { name: period, label: 진행 기간, widget: string, required: false, hint: "예) 상시 진행, 10월 1일 ~ 10월 31일" }
      - name: accent
        label: 배경 색
        widget: select
        options:
          - { label: '파랑', value: 'blue' }
          - { label: '베이지', value: 'tan' }
          - { label: '모래', value: 'sand' }
          - { label: '올리브', value: 'olive' }
        default: blue
      - name: thumbnail
        label: 대표 사진
        widget: image
        required: false
        hint: 올리면 색 대신 사진이 카드 배경이 됩니다.
      - name: order
        label: 표시 순서
        widget: number
        value_type: int
        default: 10
        hint: 숫자가 작을수록 앞에 나옵니다.
      - name: cards
        label: 카드뉴스
        widget: list
        summary: '{{fields.heading}}'
        hint: 한 장에 한 가지만 담으세요. 짧을수록 잘 읽힙니다.
        fields:
          - { name: heading, label: 카드 제목, widget: string }
          - { name: body, label: 카드 내용, widget: text, required: false }
          - { name: image, label: 카드 사진, widget: image, required: false }
      - name: draft
        label: 작성 중 (체크하면 홈페이지에 보이지 않습니다)
        widget: boolean
        default: false
      - { name: body, label: 이용 안내 (주의사항 등), widget: markdown, required: false }

  # ── 사이트 설정 ─────────────────────────────────────────────
  - name: settings
    label: 사이트 설정
    files:
      - name: contact
        label: 연락처 · 영업시간
        file: content/settings/site.json
        format: json
        fields:
          - { name: tagline, label: 브랜드 카피, widget: string, hint: 메인 화면 맨 위 큰 글자입니다. }
          - { name: description, label: 브랜드 소개글, widget: text }
          - { name: email, label: 대표 이메일, widget: string }
          - name: instagram
            label: 인스타그램 주소
            widget: string
            hint: 전체 주소를 넣으세요. 화면에 표시될 @아이디는 자동으로 뽑아냅니다.
          - name: phone
            label: 대표 전화번호
            widget: string
            required: false
            hint: 비워두면 홈페이지에 전화 버튼이 나타나지 않습니다.
          - name: naverBooking
            label: 대표 네이버 예약 주소
            widget: string
            required: false
            hint: 예약 전용 주소가 있으면 여기에 넣으세요. 가장 우선 적용됩니다.
          - name: naverPlace
            label: 대표 네이버 플레이스 주소
            widget: string
            required: false
            hint: 예약 전용 주소가 없을 때 예약 버튼이 여기로 연결됩니다.
          - name: naverVerification
            label: 네이버 사이트 인증코드
            widget: string
            required: false
            hint: >-
              네이버 서치어드바이저 → 사이트 등록 → HTML 태그 방식에서
              content="..." 안의 값만 복사해 넣으세요. 비워두면 아무것도 출력되지 않습니다.
          - name: googleVerification
            label: 구글 사이트 인증코드
            widget: string
            required: false
            hint: >-
              구글 서치콘솔 → 속성 추가 → HTML 태그 방식에서
              content="..." 안의 값만 복사해 넣으세요.
          - { name: hoursOpen, label: 영업 시작 시각, widget: string, hint: '예) 10:00' }
          - { name: hoursClose, label: 영업 종료 시각, widget: string, hint: '예) 20:30' }
          - { name: hoursNote, label: 휴무 안내, widget: string, hint: '예) 연중무휴 (명절 휴무)' }

      - name: branches
        label: 지점별 정보
        file: content/settings/branches.json
        format: json
        fields:
          - name: branches
            label: 지점
            widget: list
            summary: '{{fields.label}}'
            fields:
              # slug 와 label 은 화면에 보이지 않지만 값은 그대로 보존된다.
              # slug 가 바뀌면 지점 페이지 주소가 깨지므로 편집 대상에서 뺐다.
              - { name: slug, widget: hidden }
              - { name: label, widget: hidden }
              - { name: phone, label: 전화번호, widget: string, required: false }
              - name: naverBooking
                label: 네이버 예약 주소
                widget: string
                required: false
                hint: 예약 전용 주소입니다. 넣으면 '네이버 예약' 버튼이 이 주소로 갑니다.
              - name: naverPlace
                label: 네이버 플레이스 주소
                widget: string
                required: false
                hint: 예약 전용 주소가 없을 때 예약 버튼이 여기로 연결됩니다.
              - name: naverBlog
                label: 지점 네이버 블로그 주소
                widget: string
                required: false
                hint: 넣으면 지점 페이지에 '네이버 블로그' 버튼이 생깁니다.
              - name: naverMap
                label: 네이버 지도 주소
                widget: string
                required: false
                hint: 비워두면 네이버에 등록된 상호로 검색하는 링크가 쓰입니다.
              - name: showPrices
                label: 가격표 보이기
                widget: boolean
                default: false
                hint: 끄면 이 지점 페이지에서 가격표가 사라집니다.
              - name: priceNote
                label: 가격표 아래 안내문
                widget: text
                required: false
              - name: prices
                label: 가격 항목
                widget: list
                required: false
                summary: '{{fields.category}} · {{fields.name}} — {{fields.price}}'
                hint: 분류를 펌·염색·커트로 적으면 그 순서대로 묶여 보입니다.
                fields:
                  - name: category
                    label: 분류
                    widget: select
                    options: ['펌', '염색', '커트', '클리닉', '스타일링', '기타']
                    default: 펌
                  - { name: name, label: 시술명, widget: string, hint: '예) 일반 펌, 뿌리 염색' }
                  - { name: price, label: 금액, widget: string, hint: "'80,000원~', '상담 후 결정' 처럼 자유롭게 적으셔도 됩니다." }

      - name: home
        label: 메인 화면
        file: content/settings/home.json
        format: json
        fields:
          - { name: heroEyebrow, label: 카피 위 작은 글자, widget: string, hint: '예) Daejeon · Since 2016' }
          - { name: heroImage, label: 메인 배경 사진, widget: image, required: false }
          - { name: primaryCtaText, label: 예약 버튼 문구, widget: string, default: 예약하기 }
          - { name: secondaryCtaText, label: 보조 버튼 문구, widget: string, default: 지점 찾기 }
          - { name: secondaryCtaLink, label: 보조 버튼 주소, widget: string, default: /branches }
          - name: stats
            label: 숫자 소개
            widget: list
            summary: '{{fields.label}} {{fields.value}}'
            fields:
              - { name: label, label: 항목, widget: string }
              - { name: value, label: 값, widget: string }
          - { name: stylesTitle, label: 대표 시술 제목, widget: string }
          - name: styles
            label: 대표 시술
            widget: list
            summary: '{{fields.name}}'
            hint: 카피 바로 아래에 나옵니다. 사진을 올리면 사진 카드가 되고, 없으면 브랜드 색으로 표시됩니다.
            fields:
              - { name: name, label: 시술명, widget: string, hint: '예) 펌, 염색, 커트, 붙임머리' }
              - { name: english, label: 영문 표기, widget: string, required: false, hint: '예) PERM' }
              - { name: description, label: 한 줄 설명, widget: string, required: false }
              - { name: image, label: 사진, widget: image, required: false }
              - { name: link, label: 눌렀을 때 갈 주소, widget: string, required: false }
          - { name: branchesTitle, label: 지점 섹션 제목, widget: string }
          - { name: branchesDesc, label: 지점 섹션 설명, widget: string }
          - { name: eventsTitle, label: 이벤트 섹션 제목, widget: string }
          - { name: eventsDesc, label: 이벤트 섹션 설명, widget: string }
          - { name: blogTitle, label: 칼럼 섹션 제목, widget: string }
          - { name: blogDesc, label: 칼럼 섹션 설명, widget: string }
          - { name: videosTitle, label: 영상 섹션 제목, widget: string }
          - { name: videosDesc, label: 영상 섹션 설명, widget: string }

      - name: pages
        label: 페이지 문구
        file: content/settings/pages.json
        format: json
        fields:
          - { name: aboutTitle, label: '[브랜드] 제목', widget: string }
          - name: aboutBody
            label: '[브랜드] 소개 본문'
            widget: text
            hint: 빈 줄 하나를 사이에 두면 문단이 나뉩니다.
          - { name: aboutImage, label: '[브랜드] 사진', widget: image, required: false }
          - name: aboutFacts
            label: '[브랜드] 회사 개요표'
            widget: list
            summary: '{{fields.label}} — {{fields.value}}'
            hint: >-
              브랜드 소개 페이지 오른쪽 표입니다. 줄을 추가·삭제하거나 순서를 바꿀 수 있습니다.
              영업시간 줄은 연락처 설정에서 자동으로 붙으니 여기에 넣지 마세요.
            fields:
              - { name: label, label: 항목, widget: string, hint: '예) 사원 수' }
              - { name: value, label: 내용, widget: string, hint: '예) 5개점 총 50명' }
          - { name: branchesTitle, label: '[지점안내] 제목', widget: string }
          - { name: branchesDesc, label: '[지점안내] 설명', widget: string }
          - { name: blogTitle, label: '[헤어칼럼] 제목', widget: string }
          - { name: videosTitle, label: '[영상] 제목', widget: string }
          - { name: eventsTitle, label: '[이벤트] 제목', widget: string }
          - { name: eventsDesc, label: '[이벤트] 설명', widget: string }
          - { name: contactTitle, label: '[문의] 제목', widget: string }
          - { name: contactFormTitle, label: '[문의] 폼 제목', widget: string }
          - { name: contactFormHint, label: '[문의] 폼 안내문', widget: text }
          - { name: recruitTitle, label: '[채용] 교육과정 제목', widget: string }
          - { name: recruitDesc, label: '[채용] 교육과정 설명', widget: string }
          - { name: recruitLead, label: '[채용] 교육과정 본문', widget: text }
          - name: curriculum
            label: '[채용] 교육과정 단계'
            widget: list
            summary: 'STEP {{fields.step}} · {{fields.title}} — {{fields.subtitle}}'
            hint: 단계를 추가·삭제하거나 순서를 바꿀 수 있습니다.
            fields:
              - { name: step, label: 단계 기호, widget: string, hint: "예) A, B, JR — 화면에 'STEP A' 처럼 나옵니다" }
              - { name: title, label: 과정 이름, widget: string, hint: '예) A 과정' }
              - { name: subtitle, label: 설명, widget: string, hint: '예) 살롱 베이직 교육' }
          - { name: workplaceTitle, label: '[채용] 근무환경 제목', widget: string }
          - name: workplace
            label: '[채용] 근무환경'
            widget: list
            summary: '{{fields.label}}'
            hint: 급여·직급체계·복지처럼 묶음을 만들고, 그 안에 줄을 넣습니다.
            fields:
              - { name: label, label: 묶음 이름, widget: string, hint: '예) 급여 / 시간' }
              - name: items
                label: 내용
                widget: list
                field: { name: item, label: 한 줄, widget: string }
                hint: 한 줄씩 추가합니다.
          - { name: recruitCtaText, label: '[채용] 지원 안내문', widget: string }

      - name: promotion
        label: 띠배너 · 팝업
        file: content/settings/promotion.json
        format: json
        fields:
          - name: bannerEnabled
            label: 띠배너 사용
            widget: boolean
            default: true
            hint: 모든 페이지 맨 위에 가로 띠로 표시됩니다.
          - { name: bannerText, label: 띠배너 문구, widget: string, required: false }
          - { name: bannerLinkText, label: 띠배너 버튼 문구, widget: string, required: false, default: 자세히 보기 }
          - name: bannerLink
            label: 띠배너 주소
            widget: string
            required: false
            hint: "홈페이지 안의 주소를 넣으세요. 예) /events/first-visit"
          - name: popupEnabled
            label: 팝업 사용
            widget: boolean
            default: true
            hint: 하루에 한 번만 뜹니다. 방문자가 '오늘 하루 보지 않기'를 누르면 그날은 다시 뜨지 않습니다.
          - { name: popupTitle, label: 팝업 제목, widget: string, required: false }
          - { name: popupText, label: 팝업 내용, widget: text, required: false }
          - { name: popupImage, label: 팝업 사진, widget: image, required: false }
          - { name: popupLinkText, label: 팝업 버튼 문구, widget: string, required: false, default: 자세히 보기 }
          - { name: popupLink, label: 팝업 버튼 주소, widget: string, required: false }

      - name: maintenance
        label: 점검 안내
        file: content/settings/maintenance.json
        format: json
        fields:
          - name: enabled
            label: 점검 안내 사용
            widget: boolean
            default: true
            hint: 정한 요일·시간에 방문자에게 점검 안내 화면을 보여줍니다. 끄면 아무 일도 일어나지 않습니다.
          - name: weekday
            label: 요일
            widget: select
            options:
              - { label: '일요일', value: 0 }
              - { label: '월요일', value: 1 }
              - { label: '화요일', value: 2 }
              - { label: '수요일', value: 3 }
              - { label: '목요일', value: 4 }
              - { label: '금요일', value: 5 }
              - { label: '토요일', value: 6 }
            default: 0
          - name: startHour
            label: 시작 시각
            widget: number
            value_type: int
            min: 0
            max: 23
            default: 1
            hint: 24시간 기준입니다. 새벽 1시면 1을 넣으세요.
          - name: endHour
            label: 종료 시각
            widget: number
            value_type: int
            min: 1
            max: 24
            default: 2
            hint: 시작보다 커야 합니다. 새벽 2시면 2를 넣으세요.
          - { name: title, label: 안내 제목, widget: string }
          - { name: message, label: 안내 문구, widget: text }
          - name: showContact
            label: 예약·연락 버튼 보이기
            widget: boolean
            default: true
            hint: 점검 중에도 손님이 예약하거나 연락할 수 있게 합니다. 켜두시는 편이 좋습니다.
