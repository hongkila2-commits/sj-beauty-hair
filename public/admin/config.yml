# ─────────────────────────────────────────────────────────────
# 글 관리 화면 설정
#
# 여기 적힌 항목이 /admin 화면의 입력칸이 된다.
# 항목을 늘리고 싶으면 fields 아래에 같은 모양으로 한 줄씩 추가하면 된다.
# ─────────────────────────────────────────────────────────────

backend:
  name: github
  repo: hongkila2-commits/sj-beauty-hair
  branch: main
  base_url: https://sj-beauty-hair.vercel.app
  auth_endpoint: api/auth

# 글에 넣는 사진이 저장되는 곳
media_folder: public/uploads
public_folder: /uploads

locale: ko

# 저장 버튼을 누르면 GitHub 에 이런 문구로 기록이 남는다
site_url: https://sj-beauty-hair.vercel.app
display_url: https://sj-beauty-hair.vercel.app
logo_url: https://sj-beauty-hair.vercel.app/logo.png

collections:
  - name: posts
    label: 헤어칼럼
    label_singular: 글
    description: 홈페이지 '헤어칼럼' 에 올라가는 글입니다.
    folder: content/posts
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: 'blog/{{slug}}'
    sortable_fields: [date, title]
    view_filters:
      - label: 작성 중인 글만
        field: draft
        pattern: true
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: date, label: 작성일, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - name: category
        label: 분류
        widget: select
        options: ['헤어칼럼', '스타일', '공지']
        default: 헤어칼럼
      - name: summary
        label: 한 줄 요약
        widget: text
        required: false
        hint: 목록 화면과 검색 결과에 표시됩니다. 두 줄을 넘기지 않는 편이 좋습니다.
      - name: thumbnail
        label: 대표 사진
        widget: image
        required: false
        hint: 목록에서 보이는 사진입니다. 가로로 긴 사진이 잘 어울립니다.
      - { name: author, label: 작성자, widget: string, default: 'SJ뷰티헤어' }
      - name: draft
        label: 작성 중 (체크하면 홈페이지에 보이지 않습니다)
        widget: boolean
        default: false
      - { name: body, label: 본문, widget: markdown }

  - name: videos
    label: 영상
    label_singular: 영상
    description: 홈페이지 '영상' 페이지에 올라가는 유튜브 영상입니다.
    folder: content/videos
    create: true
    slug: '{{slug}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: 영상 제목, widget: string }
      - name: youtubeId
        label: 유튜브 코드
        widget: string
        hint: "유튜브 주소 끝의 11자리입니다. 예) https://youtu.be/AbCdEfGhIjK → AbCdEfGhIjK"
        pattern: ['^[A-Za-z0-9_-]{11}$', '유튜브 코드 11자리를 정확히 입력해 주세요.']
      - { name: date, label: 등록일, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - { name: description, label: 설명, widget: text, required: false }
      - name: draft
        label: 작성 중 (체크하면 홈페이지에 보이지 않습니다)
        widget: boolean
        default: false
      - { name: body, label: 메모, widget: markdown, required: false }

  # ── 사이트 설정 ──────────────────────────────────────────────
  # 폴더에 글을 쌓는 위 컬렉션과 달리, 정해진 파일 하나를 양식으로 편집한다.
  # 주의: 여기에 적지 않은 항목은 저장할 때 파일에서 사라진다.
  #       그래서 구조 정보(주소·사진·자치구)는 이 파일이 아니라 src/config.ts 에 둔다.
  - name: settings
    label: 사이트 설정
    files:
      - name: contact
        label: 연락처 · 영업시간
        file: content/settings/site.json
        format: json
        fields:
          - { name: email, label: 대표 이메일, widget: string }
          - name: instagram
            label: 인스타그램 주소
            widget: string
            hint: 전체 주소를 넣으세요. 화면에 표시될 @아이디는 자동으로 뽑아냅니다.
          - name: phone
            label: 대표 전화번호
            widget: string
            required: false
            hint: 비워두면 홈페이지에 전화 버튼이 나타나지 않습니다.
          - { name: hoursOpen, label: 영업 시작 시각, widget: string, hint: '예) 10:00' }
          - { name: hoursClose, label: 영업 종료 시각, widget: string, hint: '예) 20:30' }
          - { name: hoursNote, label: 휴무 안내, widget: string, hint: '예) 연중무휴 (명절 휴무)' }

      - name: branches
        label: 지점별 전화 · 예약 링크
        file: content/settings/branches.json
        format: json
        fields:
          - name: branches
            label: 지점
            widget: list
            summary: '{{fields.label}}'
            fields:
              # slug 와 label 은 화면에 보이지 않지만 값은 그대로 보존된다.
              # slug 가 바뀌면 지점 페이지 주소가 깨지므로 편집 대상에서 뺐다.
              - { name: slug, widget: hidden }
              - { name: label, widget: hidden }
              - { name: phone, label: 전화번호, widget: string, required: false }
              - name: naverBooking
                label: 네이버 예약 주소
                widget: string
                required: false
                hint: 주소를 넣으면 메인과 지점 페이지에 예약 버튼이 자동으로 나타납니다.
              - name: naverMap
                label: 네이버 지도 주소
                widget: string
                required: false
                hint: 비워두면 주소로 검색하는 링크가 대신 쓰입니다.
